name: AICop

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  aicop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build AICop CLI
        run: npm run build

      - name: AICop scan
        run: node packages/cli/dist/index.js . --severity error
