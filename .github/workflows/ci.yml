name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck --workspace=packages/cli

      - name: Lint
        run: npm run lint --workspace=packages/cli

      - name: Build
        run: npm run build --workspace=packages/cli

      - name: Self-scan (AICop scanning its own code)
        run: node packages/cli/dist/index.js ./packages/cli/src --ci --severity warn
        continue-on-error: false

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aicop-report-node${{ matrix.node-version }}
          path: .aicop/
          if-no-files-found: ignore

  aiscore-gate:
    name: AIScore™ Gate (must be ≥ 90)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=packages/cli

      - name: Run full JSON scan
        run: node packages/cli/dist/index.js ./packages/cli/src --ci --format json --output aicop-result.json

      - name: Assert AIScore ≥ 90
        run: |
          SCORE=$(node -e "const r=require('./aicop-result.json');console.log(r.summary.aiScore)")
          echo "AIScore: $SCORE"
          if [ "$SCORE" -lt 90 ]; then
            echo "❌ AIScore $SCORE is below the required 90 threshold"
            exit 1
          fi
          echo "✅ AIScore $SCORE meets the 90+ requirement"
